name: Madevi CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: madevi_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: madevi_ci_test
        ports: ["25435:5432"]
        options: >-
          --label madevi.scope=synthetic-ci
          --health-cmd "pg_isready -U madevi_test -d madevi_ci_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
        env:
          MADEVI_TEST_DATABASE_URL: postgresql://madevi_test:local-test-only@127.0.0.1:25435/madevi_ci_test
          MADEVI_TEST_DOCKER_CONTAINER: ${{ job.services.postgres.id }}
          MADEVI_TEST_BUILD: "1"
          MADEVI_TEST_LOAD: "1"
          MADEVI_VISUAL_CHECK: "1"
      - name: Validate isolated migration and runtime roles
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-db-roles.sh
      - name: Verify encrypted backup and restore
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          MADEVI_TEST_DATABASE_URL: postgresql://madevi_test:local-test-only@127.0.0.1:25435/madevi_ci_test
        run: bash scripts/test-encrypted-backup.sh
      - name: Verify isolated Docker rollback
        run: |
          docker pull caddy:2.10-alpine
          node scripts/test-docker-rollback.mjs
      - run: npm audit --omit=dev --audit-level=high
