# Contoh aplikasi pada satu server, bukan susunan produksi yang sudah aktif.
# Database dikonfigurasi terpisah setelah Ade menentukan penyedia dan cara menjalankannya.
# Buat .env.production secara privat pada server.
# PostgreSQL, HTTPS, backup dan monitoring harus dikonfigurasi terpisah.
services:
  madevi:
    build: .
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MADEVI_ENV: production
      MADEVI_DEMO_MODE: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=128m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
