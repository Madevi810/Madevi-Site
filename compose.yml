# Contoh aplikasi pada satu server, bukan susunan produksi yang sudah aktif.
# Database dikonfigurasi terpisah setelah Ade menentukan penyedia dan cara menjalankannya.
# Buat .env.production secara privat pada server.
# PostgreSQL, HTTPS, backup dan monitoring harus dikonfigurasi terpisah.
services:
  madevi:
    build: .
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      MADEVI_ENV: production
      MADEVI_DEMO_MODE: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
